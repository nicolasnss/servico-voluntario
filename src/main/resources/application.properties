spring.application.name=servico-voluntario

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/svg}
spring.datasource.username=${DB_USER:svg}
spring.datasource.password=${DB_PASSWORD:svg}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SSO institucional (Keycloak, realm pmdf). O decoder do JWT e criado de forma lazy.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/pmdf}
